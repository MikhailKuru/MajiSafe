<script>
  // --- UI Navigation ---
  function showForm() {
    hideAllScreens();
    document.getElementById('formScreen').style.display = 'block';
  }

  function showWaterTips() {
    hideAllScreens();
    document.getElementById('waterScreen').style.display = 'block';
  }

  function showWaterMap() {
    hideAllScreens();
    document.getElementById('mapScreen').style.display = 'block';
    loadMap();
  }

  function goHome() {
    hideAllScreens();
    document.getElementById('homeScreen').style.display = 'block';
    const alertBox = document.getElementById('alertBox');
    if (alertBox) alertBox.style.display = 'none';
  }

  function hideAllScreens() {
    document.getElementById('homeScreen').style.display = 'none';
    document.getElementById('formScreen').style.display = 'none';
    document.getElementById('waterScreen').style.display = 'none';
    document.getElementById('mapScreen').style.display = 'none';
  }

  // --- Risk Check ---
  function checkRisk() {
    const province = document.getElementById('province').value;
    const district = document.getElementById('district').value.trim();
    const alertBox = document.getElementById('alertBox');

    if (!province || !district) {
      alert('Please enter your province and district');
      return;
    }

    alertBox.style.display = 'block';

    if (province === 'Sofala' || province === 'Zambezia') {
      alertBox.className = 'alert danger';
      alertBox.innerHTML = '⚠️ HIGH RISK: Flooding or cyclone risk in ' + district + '. Follow safety instructions.';
    } else if (province === 'Cabo Delgado') {
      alertBox.className = 'alert warning';
      alertBox.innerHTML = '⚠️ WARNING: Possible storms or insecurity in ' + district + '. Stay alert.';
    } else {
      alertBox.className = 'alert safe';
      alertBox.innerHTML = '✅ SAFE: No active disaster alerts for ' + district + ' right now.';
    }

    sendNotification('MajiSafe Alert', alertBox.innerText);
  }

  function loadMap() {
    if (map) {
      map.invalidateSize();
      return;
    }

    map = L.map('map').setView([-18.6657, 35.5296], 6);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    clusterGroup = L.markerClusterGroup();
    map.addLayer(clusterGroup);

    loadWaterPoints();
  }

  function loadWaterPoints() {
    clusterGroup.clearLayers();

    WATER_POINTS.forEach(p => {
      const marker = L.marker([p.lat_deg, p.lon_deg]);
      marker.bindPopup('<b>Drinkable Water Source</b>');
      clusterGroup.addLayer(marker);
    });
  }

  // --- PWA / Service Worker Registration ---
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .catch(err => console.error('SW registration failed:', err));
    });
  }

  // --- Notifications ---
  function sendNotification(title, message) {
    if (!('Notification' in window)) return;

    if (Notification.permission === 'granted') {
      new Notification(title, { body: message });
      return;
    }

    if (Notification.permission !== 'denied') {
      Notification.requestPermission().then(permission => {
        if (permission === 'granted') {
          new Notification(title, { body: message });
        }
      });
    }
  }
